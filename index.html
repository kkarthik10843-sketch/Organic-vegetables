    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary: #16a34a; /* green-600 */
            --primary-hover: #15803d; /* green-700 */
            --secondary: #eab308; /* yellow-500 */
            --background: #f8fafc; /* slate-50 */
            --surface: #ffffff;
            --text-main: #0f172a; /* slate-900 */
            --text-muted: #64748b; /* slate-500 */
        }
    }

    @layer base {
        body {
            @apply bg-[var(--background)] text-[var(--text-main)] antialiased;
            font-family: 'DM Sans', sans-serif;
            background-image: radial-gradient(circle at 85% 0%, rgba(22, 163, 74, 0.08), transparent 28rem);
        }
        h1, h2, h3, h4, h5, h6 {
            @apply font-bold tracking-tight;
            font-family: 'Space Grotesk', sans-serif;
        }
    }

    @layer components {
        .btn-primary {
            @apply bg-[var(--primary)] text-white px-6 py-3 rounded-lg font-semibold hover:bg-[var(--primary-hover)] transition-colors shadow-sm inline-flex items-center justify-center gap-2;
        }
        .btn-secondary {
            @apply bg-white text-[var(--primary)] border-2 border-[var(--primary)] px-6 py-3 rounded-lg font-semibold hover:bg-green-50 transition-colors shadow-sm inline-flex items-center justify-center gap-2;
        }
        .card {
            @apply bg-[var(--surface)] rounded-xl shadow-sm border border-slate-200 overflow-hidden;
        }
    }

    @layer utilities {
        .glass-nav {
            @apply bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50;
        }
        .section-kicker { @apply text-xs uppercase tracking-[0.2em] font-bold text-[var(--primary)] mb-3; }
        .input-control { @apply w-full border border-slate-200 rounded-lg px-4 py-3 bg-white outline-none focus:ring-2 focus:ring-green-200 focus:border-[var(--primary)] transition; }
        .page-shell { @apply max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12; }
    }
    </style>
</head>
